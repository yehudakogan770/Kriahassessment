<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reading Progress - Ganeinu Academy</title>
<link rel="stylesheet" href="styles.css" />
<style>
  .auth-card {
    max-width: 360px;
    margin: 60px auto;
  }
  .auth-switch { margin-top: 14px; font-size: 12.5px; color: var(--muted); text-align: center; }
  .auth-switch button {
    background: none; border: none; padding: 0; color: var(--accent);
    text-decoration: underline; cursor: pointer; font-size: inherit;
  }
  .field textarea {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 6px;
    resize: vertical;
  }
  .student-list { margin-top: 10px; border-top: 1px solid var(--border); }
  .student-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 9px 4px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    background: none;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
  }
  .student-row:hover { background: var(--bg); }
  .student-row.active { background: var(--accent-light); }
  .student-row .s-name { font-weight: 600; flex: 1; }
  .student-row .s-grade { color: var(--muted); font-size: 12.5px; }
  .student-row .s-meta { color: var(--muted); font-size: 11.5px; }
  .empty-list { color: var(--muted); font-size: 13px; padding: 10px 4px; }
  .mastery-radios { display: flex; flex-direction: column; gap: 4px; font-weight: 400; font-size: 13.5px; }
  .mastery-radios label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .mastery-radios input { margin: 0; }
  .assessment-entry { border-bottom: 1px solid var(--border); padding: 10px 2px; }
  .assessment-entry:last-child { border-bottom: none; }
  .assessment-head { display: flex; align-items: baseline; gap: 8px; }
  .assessment-skill { font-weight: 600; flex: 1; }
  .assessment-date { color: var(--muted); font-size: 12px; }
  .assessment-notes { color: #444; font-size: 13px; margin: 4px 0 0; white-space: pre-wrap; }
  .assessment-by { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .mastery-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .mastery-badge.mastered { background: #1e7a34; color: #fff; }
  .mastery-badge.approaching { background: #b3830f; color: #fff; }
  .mastery-badge.progressing { background: #666; color: #fff; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
</style>
</head>
<body>
  <header class="app-header">
    <h1>Reading Progress</h1>
    <p>Ganeinu Academy - track and review student reading assessments.</p>
  </header>

  <main>
    <section id="auth-view" class="card auth-card" hidden>
      <h2 id="auth-heading">Teacher Sign In</h2>
      <form id="login-form">
        <label class="field">
          <span>Email</span>
          <input type="email" id="login-email" required maxlength="120" autocomplete="username" />
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" id="login-password" required autocomplete="current-password" />
        </label>
        <button type="submit" class="btn btn-primary">Sign In</button>
        <p id="login-status" class="status-message" role="status"></p>
      </form>

      <form id="signup-form" hidden>
        <label class="field">
          <span>Name</span>
          <input type="text" id="signup-name" required maxlength="80" autocomplete="name" />
        </label>
        <label class="field">
          <span>Email</span>
          <input type="email" id="signup-email" required maxlength="120" autocomplete="username" />
        </label>
        <label class="field">
          <span>Password <em>(8+ characters)</em></span>
          <input type="password" id="signup-password" required minlength="8" autocomplete="new-password" />
        </label>
        <button type="submit" class="btn btn-primary">Create Account</button>
        <p id="signup-status" class="status-message" role="status"></p>
      </form>

      <p class="auth-switch">
        <span id="to-signup-wrap">New teacher? <button type="button" id="show-signup">Create an account</button></span>
        <span id="to-login-wrap" hidden>Already have an account? <button type="button" id="show-login">Sign in</button></span>
      </p>
    </section>

    <div id="app-view" class="layout" hidden>
      <section class="panel">
        <div class="card">
          <div class="top-bar">
            <h2>Students</h2>
          </div>
          <form id="add-student-form" class="field-row">
            <label class="field">
              <span>Name</span>
              <input type="text" id="new-student-name" required maxlength="80" />
            </label>
            <label class="field field-narrow">
              <span>Grade <em>(optional)</em></span>
              <input type="text" id="new-student-grade" maxlength="40" placeholder="e.g. 2A" />
            </label>
            <button type="submit" class="btn btn-primary">Add</button>
          </form>
          <p id="add-student-status" class="status-message" role="status"></p>
          <div id="student-list" class="student-list"></div>
        </div>
        <p class="hint">Signed in as <strong id="teacher-name"></strong> - <button type="button" id="logout-btn" class="btn-link">Sign out</button></p>
      </section>

      <section class="panel">
        <div class="card" id="student-detail-card" hidden>
          <h2 id="student-detail-name"></h2>
          <form id="log-assessment-form">
            <div class="field-row">
              <label class="field">
                <span>Skill</span>
                <input type="text" id="assess-skill" required maxlength="120" placeholder="e.g. Sheva Rules" />
              </label>
              <label class="field field-narrow">
                <span>Date</span>
                <input type="date" id="assess-date" required />
              </label>
            </div>
            <label class="field">
              <span>Mastery</span>
              <div class="mastery-radios">
                <label><input type="radio" name="mastery" value="mastered" /> Mastered</label>
                <label><input type="radio" name="mastery" value="approaching" /> Approaching Mastery</label>
                <label><input type="radio" name="mastery" value="progressing" checked /> Making Progress</label>
              </div>
            </label>
            <label class="field">
              <span>Notes <em>(optional)</em></span>
              <textarea id="assess-notes" maxlength="2000" rows="3"></textarea>
            </label>
            <button type="submit" class="btn btn-primary">Log Assessment</button>
            <p id="log-status" class="status-message" role="status"></p>
          </form>

          <h2 style="margin-top: 22px;">History</h2>
          <div id="assessment-history"></div>
        </div>
        <p id="no-student-placeholder" class="hint">Select or add a student to log an assessment.</p>
      </section>
    </div>
  </main>

  <script src="progress.js"></script>
</body>
</html>
