<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Class Progress Report - Ganeinu Academy</title>
<link rel="stylesheet" href="styles.css" />
<style>
  main { max-width: 900px; margin: 0 auto; padding: 20px 24px 40px; }
  .controls-row { display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 18px; }
  .controls-row .field { margin-bottom: 0; min-width: 160px; }
  .student-report-card { margin-bottom: 14px; }
  .student-report-head {
    display: flex; align-items: baseline; gap: 8px; cursor: pointer;
  }
  .student-report-head h3 { margin: 0; font-size: 15px; }
  .student-report-head .s-grade { color: var(--muted); font-size: 12.5px; }
  .student-report-head .s-count { margin-left: auto; color: var(--muted); font-size: 12px; }
  .skill-chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .skill-chip {
    display: inline-flex; flex-direction: column; gap: 1px;
    padding: 5px 10px; border-radius: 8px; font-size: 11.5px; line-height: 1.3;
    background: #eee; color: #333; max-width: 220px;
  }
  .skill-chip .chip-skill { font-weight: 600; }
  .skill-chip .chip-meta { color: inherit; opacity: 0.85; }
  .skill-chip.mastered { background: #1e7a34; color: #fff; }
  .skill-chip.approaching { background: #b3830f; color: #fff; }
  .skill-chip.progressing { background: #666; color: #fff; }
  .skill-chip.timing { background: var(--accent-light); color: #333; }
  .assessment-entry { border-bottom: 1px solid var(--border); padding: 10px 2px; }
  .assessment-entry:last-child { border-bottom: none; }
  .assessment-head { display: flex; align-items: baseline; gap: 8px; }
  .assessment-skill { font-weight: 600; flex: 1; }
  .assessment-date { color: var(--muted); font-size: 12px; }
  .assessment-notes { color: #444; font-size: 13px; margin: 4px 0 0; white-space: pre-wrap; }
  .assessment-by { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .mastery-badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .mastery-badge.mastered { background: #1e7a34; color: #fff; }
  .mastery-badge.approaching { background: #b3830f; color: #fff; }
  .mastery-badge.progressing { background: #666; color: #fff; }
  .empty-list { color: var(--muted); font-size: 13px; padding: 10px 4px; }
</style>
</head>
<body>
  <header class="app-header">
    <img src="ganeinu-academy-logo.png" alt="Ganeinu Academy" class="brand-logo" />
    <div class="brand-text">
      <h1>Ganeinu Academy - Class Progress Report</h1>
      <p>View a class's or the whole school's reading progress.</p>
      <p><a href="progress.html">&larr; Back to Reading Progress</a></p>
    </div>
  </header>

  <main>
    <div class="controls-row">
      <label class="field">
        <span>Class</span>
        <select id="grade-select">
          <option value="">All Students (whole school)</option>
        </select>
      </label>
      <div class="field">
        <span>View</span>
        <div class="format-toggle" role="radiogroup" aria-label="View mode">
          <label class="radio-pill">
            <input type="radio" name="view-mode" value="general" checked />
            <span>General</span>
          </label>
          <label class="radio-pill">
            <input type="radio" name="view-mode" value="detailed" />
            <span>Detailed</span>
          </label>
        </div>
      </div>
      <div class="field">
        <span>Metric</span>
        <div class="format-toggle" role="radiogroup" aria-label="Metric">
          <label class="radio-pill">
            <input type="radio" name="metric-mode" value="accuracy" checked />
            <span>Accuracy</span>
          </label>
          <label class="radio-pill">
            <input type="radio" name="metric-mode" value="fluency" />
            <span>Fluency</span>
          </label>
        </div>
      </div>
    </div>

    <div id="report-status" class="status-message" role="status"></div>
    <div id="report-body"></div>
  </main>

  <script src="progress-report.js"></script>
</body>
</html>
